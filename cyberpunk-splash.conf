# Cyberpunk splash settings. Edit, then run: sudo cyberpunk-splash-stamp
# Big title shown on the splash.
TITLE=CYBERPUNK
# Optional title font: the name of any font installed on this machine (for
# example one you downloaded yourself), used on the splash, the wallpaper and the
# lock screen. Empty uses the bundled Rajdhani. The bundled alternates are
# Oxanium, Chakra Petch and Tektur. If the name is not installed, the title falls
# back to Rajdhani.
TITLE_FONT=
# Title size for that font in percent (50 to 150). Display fonts often run wider.
TITLE_FONT_SCALE=100
# Optional font for the line under the title, chosen on its own. Empty uses
# Rajdhani. The bundled alternates are Oxanium, Chakra Petch and Tektur.
TAGLINE_FONT=
# Line under the title.
TAGLINE=OS // neural desktop
# Name shown in "WELCOME BACK, <name>" on the last stage. Empty hides it.
USER_NAME=
# Colors: a name (yellow, cyan, red, magenta, green, orange, violet, white)
# or a hex value like #fcee09. Invalid values fall back to the default.
# Main color: HUD text, bars, brackets, log markers.
ACCENT=cyan
# Second color: glitch flashes and some log markers.
SECONDARY=magenta

# Visual effects. Set any of these to "no" to turn that effect off.
# Title glitch: colored slices that flash across the title.
GLITCH_TITLE=yes
# CRT tear: a strip of the screen jumps sideways and the frame jitters.
CRT_TEAR=yes
# CRT roll: a faint light band scrolls down the screen.
CRT_ROLL=yes
# CRT flicker: brief brightness dips.
CRT_FLICKER=yes
# Scanlines drawn over the whole splash.
SCANLINES=yes
# Login-screen wallpaper: regenerate it from the title and colors on every
# stamp. Written to /var/lib/plasmalogin/wallpapers/cyberpunk-splash.png.
LOGIN_WALLPAPER=yes
# Design for the login and lock screen still image: DataTerminal, HexColumns,
# Terminal, or Still (the original). The clock is left
# out of a still, since an image cannot tick.
LOGIN_STYLE=DataTerminal
# Lines shown in the log of the Data terminal design, in order, comma
# separated, each with its own sparkline. CPU lines (cpu, cputemp, mem) use the
# accent color and GPU lines (gpu, gputemp, vram) the secondary color. Also:
# uptime, os, kernel, plasma, qt, host. cpu, cputemp, mem, gpu, gputemp, vram and
# uptime are live and appear only in the wallpaper plugin; os, kernel, plasma, qt
# and host are static and also shown in the login still. Nothing identifying is
# shown: no user names, addresses or files.
LOG_ITEMS=cpu,cputemp,mem,gpu,gputemp,vram,uptime
# Polling: how often the live readings are read, in seconds (1 to 60). Slower
# is cheaper; the numbers on each line change at this rate.
LOG_REFRESH=2
# Sparkline granularity: seconds between points (1 to 300, default is the
# polling rate) and how many points each graph keeps (10 to 120). The graph
# covers SPARK_STEP x SPARK_POINTS seconds: the defaults show the last 80 seconds,
# 5 and 60 would show the last 5 minutes.
SPARK_STEP=2
SPARK_POINTS=40
# Show the title and tagline on the login wallpaper (yes or no).
LOGIN_TITLE=yes
# Where the title sits: percent of the screen height from the top (0 to 80).
# The default of 40 sits below the login and lock clock; lower it to move up.
LOGIN_TITLE_Y=40
# Optional: show the kernel whose /usr/lib/modules/*/pkgbase matches.
# Leave empty to show the newest installed kernel.
# Example: KERNEL_PKGBASE=linux-cachyos
KERNEL_PKGBASE=
