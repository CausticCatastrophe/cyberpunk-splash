# Cyberpunk splash settings. Edit, then run: sudo cyberpunk-splash-stamp
# Big title shown on the splash.
TITLE=CYBERPUNK
# Optional title font: the name of any font installed on this machine (for
# example one you downloaded yourself), used on the splash, the wallpaper and the
# lock screen. Empty uses the bundled Rajdhani. The bundled alternates are
# Oxanium, Chakra Petch and Tektur. If the name is not installed, the title falls
# back to Rajdhani.
TITLE_FONT=
# Title size for that font in percent (50 to 150). Display fonts often run wider.
TITLE_FONT_SCALE=100
# Optional font for the line under the title, chosen on its own. Empty uses
# Rajdhani. The bundled alternates are Oxanium, Chakra Petch and Tektur.
TAGLINE_FONT=
# Line under the title.
TAGLINE=OS // neural desktop
# Name shown in "WELCOME BACK, <name>" on the last stage. Empty hides it.
USER_NAME=
# Colors: a name (yellow, cyan, red, magenta, green, orange, violet, white)
# or a hex value like #fcee09. Invalid values fall back to the default.
# Main color: HUD text, bars, brackets, log markers.
ACCENT=cyan
# Second color: glitch flashes and some log markers.
SECONDARY=magenta

# Visual effects. Set any of these to "no" to turn that effect off.
# Title glitch: colored slices that flash across the title.
GLITCH_TITLE=yes
# CRT tear: a strip of the screen jumps sideways and the frame jitters.
CRT_TEAR=yes
# CRT roll: a faint light band scrolls down the screen.
CRT_ROLL=yes
# CRT flicker: brief brightness dips.
CRT_FLICKER=yes
# Scanlines drawn over the whole splash.
SCANLINES=yes
# Login-screen wallpaper: regenerate it from the title and colors on every
# stamp. Written to /var/lib/plasmalogin/wallpapers/cyberpunk-splash.png.
LOGIN_WALLPAPER=yes
# Design for the login and lock screen still image: DataTerminal, HexColumns,
# Terminal, or Still (the original). The clock is left
# out of a still, since an image cannot tick.
LOGIN_STYLE=DataTerminal
# Lines shown in the log of the Data terminal design, in order, comma
# separated, each with its own sparkline. CPU lines (cpu, cputemp, mem) use the
# accent color and GPU lines (gpu, gputemp, vram) the secondary color. Also:
# case, uptime, os, kernel, plasma, qt, host. cpu, cputemp, mem, gpu, gputemp,
# vram, case and uptime are live and appear only in the wallpaper plugin; os, kernel, plasma, qt
# and host are static and also shown in the login still. Nothing identifying is
# shown: no user names, addresses or files.
LOG_ITEMS=cpu,cputemp,mem,gpu,gputemp,vram,case
# The GPU panel (top right: model, clock, power, fan, junction temperature) and the
# CPU core map (bottom left: one tile per core). Both are live, so they appear only
# in the wallpaper plugin. yes or no.
GPU_PANEL=yes
CORE_MAP=yes
# Which sensor feeds each reading. Empty keeps the default, which suits most
# single-GPU machines. If yours differ (a second GPU, another motherboard chip),
# pick them on the wallpaper settings page, which lists the sensors on your
# machine, or set their ids here. Find ids with: kstatsviewer --list
# SENSOR_CPU=cpu/all/usage            SENSOR_CPU_TEMP=cpu/all/averageTemperature
# SENSOR_MEM_USED=memory/physical/used  SENSOR_MEM_TOTAL=memory/physical/total
# SENSOR_GPU=gpu/gpu0/usage           SENSOR_GPU_TEMP=gpu/gpu0/temperature
# SENSOR_VRAM_USED=gpu/gpu0/usedVram  SENSOR_VRAM_TOTAL=gpu/gpu0/totalVram
# SENSOR_UPTIME=os/system/uptime
# GPU panel: SENSOR_GPU_NAME=gpu/gpu0/name  SENSOR_GPU_CLOCK=gpu/gpu0/coreFrequency
#   SENSOR_GPU_POWER=gpu/gpu0/power1  SENSOR_GPU_FAN=gpu/gpu0/fan1
#   SENSOR_GPU_JUNCTION=gpu/gpu0/temp2
# Core map: SENSOR_CORE_COUNT=cpu/all/coreCount (each core uses cpu/cpuN/usage)
# Case temperature: the sensor id of your motherboard case or system temperature,
# for the "case" line. Find it with:  kstatsviewer --list | grep -i -E 'systin|temp'
# (the one your System Monitor widget labels Case). Empty hides the line.
# Example: CASE_SENSOR=lmsensors/nct6798-isa-0290/temp1
CASE_SENSOR=
# Polling: how often the live readings are read, in seconds (1 to 60). Slower
# is cheaper; the numbers on each line change at this rate. The defaults match
# the System Monitor widgets: 1 second.
LOG_REFRESH=1
# Sparkline granularity: seconds between points (1 to 300, default is the
# polling rate) and how many points each graph keeps (10 to 120). A graph
# covers SPARK_STEP x SPARK_POINTS seconds: the defaults (1 and 60) show the last
# minute, like the System Monitor charts. 5 and 60 would show the last 5 minutes.
SPARK_STEP=1
SPARK_POINTS=60
# Graph vertical range: auto zooms to the data so small changes show (as the
# System Monitor charts do), fixed always uses the full range (0 to 100 percent).
SPARK_SCALE=auto
# Draw the graph line as a smooth curve (yes) or straight segments (no).
SPARK_SMOOTH=yes
# Strength of the background grid, in percent (0 turns it off, up to 40). The
# default is a bit stronger than before so the grid reads on dark screens.
GRID_OPACITY=14
# Show the title and tagline on the login wallpaper (yes or no).
LOGIN_TITLE=yes
# Where the title sits: percent of the screen height from the top (0 to 80).
# The default of 35 centers the title and tagline vertically; raise it to move
# them down, for example below the login clock.
LOGIN_TITLE_Y=35
# Optional: show the kernel whose /usr/lib/modules/*/pkgbase matches.
# Leave empty to show the newest installed kernel.
# Example: KERNEL_PKGBASE=linux-cachyos
KERNEL_PKGBASE=
