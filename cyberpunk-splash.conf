# Cyberpunk splash settings. Edit, then run: sudo cyberpunk-splash-stamp
# Big title shown on the splash.
TITLE=CYBERPUNK
# Line under the title.
TAGLINE=OS // neural desktop
# Name shown in "WELCOME BACK, <name>" on the last stage. Empty hides it.
USER_NAME=
# Colors: a name (yellow, cyan, red, magenta, green, orange, violet, white)
# or a hex value like #fcee09. Invalid values fall back to the default.
# Main color: HUD text, bars, brackets, log markers.
ACCENT=cyan
# Second color: glitch flashes and some log markers.
SECONDARY=magenta

# Visual effects. Set any of these to "no" to turn that effect off.
# Title glitch: colored slices that flash across the title.
GLITCH_TITLE=yes
# CRT tear: a strip of the screen jumps sideways and the frame jitters.
CRT_TEAR=yes
# CRT roll: a faint light band scrolls down the screen.
CRT_ROLL=yes
# CRT flicker: brief brightness dips.
CRT_FLICKER=yes
# Scanlines drawn over the whole splash.
SCANLINES=yes
# Optional: show the kernel whose /usr/lib/modules/*/pkgbase matches.
# Leave empty to show the newest installed kernel.
# Example: KERNEL_PKGBASE=linux-cachyos
KERNEL_PKGBASE=
